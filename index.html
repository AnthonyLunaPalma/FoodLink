<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodLink - Rescate de alimentos</title>
    <link rel="stylesheet" href="../CSS/index.css">
</head>
<body id="pagina-index">

    <!--header -->
    <header class="encabezado" id="encabezado-principal">
        <div class="logo" id="logo">
            <h1 class="titulo-logo" id="titulo-logo">FoodLink</h1>
        </div>
        <nav class="menu-nav" id="menu-principal">
            <a href="../HTML/index.html"><button type="button" class="boton-nav" id="btn-nav-inicio">Inicio</button></a>
            <a href="../HTML/iniciosesion.html"><button type="button" class="boton-nav" id="btn-nav-login">Iniciar sesión</button></a>
            <a href="../HTML/registro.html"><button type="button" class="boton-nav" id="btn-nav-registro">Registrarse</button></a>
        </nav>
    </header>

    <!--main--> 
    <main class="contenido-principal" id="contenido-principal">

        <!--Landing page-->
        <section class="vista" id="seccion-inicio">
            <div class="bloque-bienvenida" id="bloque-bienvenida">
                <h2 class="titulo-seccion" id="titulo-inicio">Rescatamos alimentos, combatimos el desperdicio</h2>
                <p class="texto-descripcion" id="texto-inicio">
                    FoodLink conecta a donadores (mercados y tiendas) con receptores
                    (casas hogar y comedores) mediante voluntarios logísticos, para que
                    los alimentos lleguen antes de su caducidad.
                </p>
                <button type="button" class="boton-principal" id="btn-inicio-registro">Quiero participar</button>
                <button type="button" class="boton-secundario" id="btn-inicio-login">Ya tengo cuenta</button>
            </div>
        </section>

    <!--footer-->
    <footer class="pie-pagina" id="pie-pagina">
        <p class="texto-pie" id="texto-pie">FoodLink &copy; 2026 - Rescate de alimentos</p>
    </footer>

    <script src="../app.js"></script>
</body>
</html>
